<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <defs>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="32" height="64"></rect>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="32" y="0" width="32" height="64"></rect>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="12" fill="#05060A"></rect>
  
  <g clip-path="url(#leftHalf)">
    <polygon points="12,16 52,16 32,52" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linejoin="round"></polygon>
    <polygon points="22,22 42,22 32,42" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linejoin="round"></polygon>
  </g>
  
  <g clip-path="url(#rightHalf)">
    <polygon points="12,16 52,16 32,52" fill="none" stroke="#E879F9" stroke-width="4" stroke-linejoin="round"></polygon>
    <polygon points="22,22 42,22 32,42" fill="none" stroke="#E879F9" stroke-width="2" stroke-linejoin="round"></polygon>
  </g>
  
  <line x1="32" y1="16" x2="32" y2="52" stroke="#05060A" stroke-width="0.6"></line>
</svg>