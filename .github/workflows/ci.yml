name: CI

# Gates objetivos para cada push/PR a main (#FASE2-NEW-1).
# test → suite pytest | lint → ruff correctness | secrets → gitleaks | coverage → umbral escalonado.
# Coverage: gate final en 95% sobre los módulos críticos (#FASE2-NEW-4 / T-P cerrado
# 2026-05-24). Los 9 módulos críticos están a 100% (config a 94%, sin target); el TOTAL
# medido del set es 99%. Ver docs/coverage_audit_2026-05-25.md (sección "Cierre T-P").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-v0.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install ruff
      - run: ruff check .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-v0.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt -r requirements-dev.txt pytest-cov
      - run: >
          python -m pytest tests/
          --cov=dispatcher --cov=historian --cov=the_ear --cov=correlation_guard
          --cov=universe_selector --cov=config --cov=claude_client --cov=market_clock
          --cov=main
          --cov-report=term-missing --cov-fail-under=95

  # #TD-NEW-7: SAST con Semgrep en el CI (Linux). El plugin local quedó
  # deshabilitado — Semgrep no corre nativo en Windows (requiere WSL) y su hook
  # SessionStart fallaba en cada arranque. Arranca INFORMATIVO (sin --error → no
  # bloquea el push) para establecer el baseline del código actual sin frenar el
  # bundle. Escalar a BLOQUEANTE (agregar --error) una vez revisado el baseline.
  sast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-v0.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install semgrep
      - run: >
          semgrep scan
          --config p/python --config p/security-audit --config p/secrets
          --metrics off --disable-version-check
